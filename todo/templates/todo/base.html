<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Todo List{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex">

    <aside class="w-64 border-r border-slate-800/60 bg-slate-950/20 backdrop-blur-md p-6 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="mb-8 px-2">
                <span class="text-xl font-black bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent tracking-wider">
                    TASK MANAGER
                </span>
            </div>
            
            <nav class="space-y-1.5">
                <a href="{% url 'todo:task-list' %}" 
                   class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all {% if request.resolver_match.url_name == 'task-list' %} bg-indigo-600/20 text-indigo-400 border border-indigo-500/20 {% else %} text-slate-400 hover:bg-slate-800/40 hover:text-slate-200 {% endif %}">
                    <span>🏠</span> Головна
                </a>
                <a href="{% url 'todo:tag-list' %}" 
                   class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all {% if request.resolver_match.url_name == 'tag-list' %} bg-indigo-600/20 text-indigo-400 border border-indigo-500/20 {% else %} text-slate-400 hover:bg-slate-800/40 hover:text-slate-200 {% endif %}">
                    <span>🏷️</span> Теги
                </a>
            </nav>
        </div>
        
        <div class="text-xs text-slate-600 px-2">
            Mate Academy Practice © 2026
        </div>
    </aside>

    <main class="flex-1 p-6 md:p-10 overflow-y-auto max-w-5xl mx-auto w-full">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
