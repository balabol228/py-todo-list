{% extends 'todo/base.html' %}

{% block content %}
<h2>Ви впевнені, що хочете видалити це?</h2>
<div class="card col-md-6 mt-4 border-danger">
    <div class="card-body">
        <p>Цю дію не можна буде скасувати.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Так, видалити</button>
            <a href="javascript:history.back()" class="btn btn-outline-secondary ms-2">Скасувати</a>
        </form>
    </div>
</div>
{% endblock %}
